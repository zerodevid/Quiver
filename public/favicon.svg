<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Quiver: monogram Q di lencana hijau hutan. Lingkarannya adalah mulut quiver
       dilihat dari atas; ekor Q-nya adalah ujung berbulu (fletching) sebuah anak
       panah yang tersimpan di dalamnya. Emas di atas hijau, garis tipis, tanpa
       ornamen — sumber yang sama dengan web/src/components/Logo.jsx. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#173D2C"/><stop offset="1" stop-color="#0B1F16"/></linearGradient>
    <linearGradient id="au" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F3DC96"/><stop offset="1" stop-color="#C39A2C"/></linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <rect x="1" y="1" width="62" height="62" rx="14" fill="none" stroke="#F1D78E" stroke-opacity=".2"/>
  <g fill="none" stroke="url(#au)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="30" cy="30" r="15"/>
    <path d="M36 36 L51.5 51.5"/>
    <path d="M45.5 45.5 L46.5 52.5 M45.5 45.5 L52.5 46.5"/>
  </g>
</svg>
